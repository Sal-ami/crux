name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            curl -fsSL https://musl.cc/aarch64-linux-musl-cross.tgz | sudo tar -xz -C /
            echo "/aarch64-linux-musl-cross/bin" >> $GITHUB_PATH
          fi
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../crux-${{ matrix.target }}.tar.gz crux
          cd ../../..
          sha256sum crux-${{ matrix.target }}.tar.gz > crux-${{ matrix.target }}.tar.gz.sha256
      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/crux.exe" -DestinationPath "crux-${{ matrix.target }}.zip"
          (Get-FileHash "crux-${{ matrix.target }}.zip" -Algorithm SHA256).Hash + "  crux-${{ matrix.target }}.zip" | Out-File -Encoding ascii "crux-${{ matrix.target }}.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            crux-${{ matrix.target }}.${{ matrix.archive }}
            crux-${{ matrix.target }}.${{ matrix.archive }}.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            crux-*.tar.gz
            crux-*.tar.gz.sha256
            crux-*.zip
            crux-*.zip.sha256
          generate_release_notes: true
